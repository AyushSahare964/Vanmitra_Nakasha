<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background disc -->
  <circle cx="64" cy="64" r="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Outer orbital ring arc -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#f97316" stroke-width="3.5" stroke-dasharray="80 18 120 40" stroke-linecap="round" />

  <!-- Left Circuit Nodes -->
  <g stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 18 42 L 34 42 L 44 54" />
    <path d="M 14 64 L 38 64" stroke="#f97316" />
    <path d="M 18 84 L 34 84 L 46 72" />
  </g>
  <!-- Circuit node terminal dots -->
  <circle cx="18" cy="42" r="3.5" fill="#0284c7" />
  <circle cx="14" cy="64" r="3.5" fill="#f97316" />
  <circle cx="18" cy="84" r="3.5" fill="#0284c7" />
  <circle cx="34" cy="42" r="2.5" fill="#0284c7" />
  <circle cx="34" cy="84" r="2.5" fill="#0284c7" />

  <!-- The Bold "A" Glyph -->
  <!-- Left Leg (Navy Gradient) -->
  <polygon points="62,26 42,98 56,98 70,48" fill="url(#blueGrad)" />
  <!-- Right Leg (Navy Gradient) -->
  <polygon points="62,26 82,98 68,98 54,48" fill="url(#blueGrad)" />

  <!-- Dynamic Orange Swoosh / Crossbar -->
  <path d="M 38 78 Q 66 72 108 42 Q 74 64 48 76 Z" fill="url(#orangeGrad)" />
</svg>
