<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certify-Scan Intelligence Dashboard</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Inter & Lexend for the new title -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* Using Inter as the default font */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Light gray background */
        }
        /* Style for the new Certify-Scan title */
        .brand-title {
            font-family: 'Lexend', sans-serif;
            background: linear-gradient(to right, #1e3a8a, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Custom scrollbar for a cleaner look */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        /* Modal animation */
        #watchlist-modal-content {
            transition: all 0.3s ease-out;
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="p-4 sm:p-6 lg:p-8 max-w-screen-2xl mx-auto">
        <!-- Header Section -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold brand-title">Yathābhūta</h1>
            <button class="text-gray-500 hover:text-gray-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </header>

        <!-- Main Dashboard Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Left and Middle Column -->
            <div class="lg:col-span-2 space-y-6">

                <!-- KPI Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                    <div class="bg-white p-5 rounded-xl shadow-sm">
                        <p class="text-sm text-gray-500">Total Products Monitored</p>
                        <p id="total-products" class="text-3xl font-bold text-gray-800 mt-1">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm">
                        <p class="text-sm text-gray-500">Active Violations</p>
                        <div class="flex items-baseline space-x-2">
                            <p id="active-violations" class="text-3xl font-bold text-gray-800 mt-1">0</p>
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.707-10.293a1 1 0 00-1.414-1.414l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l.293.293a1 1 0 001.414-1.414l-3-3z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                    <!-- Watchlist Card (Modified) -->
                    <div id="watchlist-card" class="bg-white p-5 rounded-xl shadow-sm cursor-pointer hover:shadow-lg transition-shadow duration-300">
                        <p class="text-sm text-gray-500">Watchlist</p>
                         <div class="flex items-baseline space-x-2">
                            <p id="watchlist-count" class="text-3xl font-bold text-gray-800 mt-1">0</p>
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-500" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.022 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm">
                        <p class="text-sm text-gray-500">Compliance Score</p>
                        <p id="compliance-score" class="text-3xl font-bold text-green-600 mt-1">0%</p>
                    </div>
                </div>

                <!-- Charts -->
                <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
                    <div class="md:col-span-3 bg-white p-6 rounded-xl shadow-sm flex flex-col h-72 md:h-80">
                        <h2 class="font-semibold text-gray-700 flex-shrink-0">Violation Trends</h2>
                        <div class="relative mt-4 flex-grow">
                            <canvas id="violationTrendsChart"></canvas>
                        </div>
                    </div>
                    <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm flex flex-col h-72 md:h-80">
                        <h2 class="font-semibold text-gray-700 flex-shrink-0">Platform Comparison</h2>
                        <div class="relative mt-4 flex-grow">
                            <canvas id="platformComparisonChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Detailed Violations Table -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h2 class="font-semibold text-gray-700 mb-4">Detailed Violations</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-gray-500 uppercase bg-gray-50 rounded-t-lg">
                                <tr>
                                    <th scope="col" class="px-6 py-3">Product</th>
                                    <th scope="col" class="px-6 py-3">Platform</th>
                                    <th scope="col" class="px-6 py-3">MRP Shown</th>
                                    <th scope="col" class="px-6 py-3">Actual MRP</th>
                                    <th scope="col" class="px-6 py-3">Difference</th>
                                    <th scope="col" class="px-6 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody id="violations-table-body">
                                <!-- JS will populate this -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Live Alerts -->
                <div class="bg-white p-6 rounded-xl shadow-sm h-96">
                    <h2 class="font-semibold text-gray-700 mb-4">Live Alerts</h2>
                    <div id="live-alerts" class="space-y-4 overflow-y-auto h-full max-h-[280px] pr-2 custom-scrollbar">
                        <!-- JS will populate this -->
                    </div>
                </div>
                <!-- Meet Section -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h2 class="font-semibold text-gray-700 mb-4">Meet</h2>
                    <div id="meet-section" class="space-y-3">
                        <!-- JS will populate this -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Watchlist Modal (New) -->
    <div id="watchlist-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center p-4 z-50">
        <div id="watchlist-modal-content" class="bg-white rounded-xl shadow-2xl w-full max-w-md transform scale-95 opacity-0">
            <div class="flex justify-between items-center p-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-800">Suspicious Product Watchlist</h3>
                <button id="close-watchlist-modal" class="text-gray-400 hover:text-gray-700 text-3xl leading-none">&times;</button>
            </div>
            <div id="watchlist-modal-body" class="p-6 max-h-[70vh] overflow-y-auto custom-scrollbar space-y-4">
                <!-- JS will populate notifications here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- GLOBAL CHART VARIABLES ---
            let violationTrendsChart, platformComparisonChart;

            // --- DATA FETCHING AND UI INITIALIZATION ---
            async function initializeDashboard() {
                try {
                    const data = await getMockData() || {};

                    updateKPIs(data.kpis);
                    populateViolationsTable(data.violations);
                    populateLiveAlerts(data.liveAlerts);
                    populateMeetSection(data.meet);
                    populateWatchlistModal(data.watchlist?.items); // New
                    renderViolationTrendsChart(data.violationTrends);
                    renderPlatformComparisonChart(data.platformComparison);

                } catch (error) {
                    console.error("Failed to initialize dashboard:", error);
                    // If the fetch fails, load the UI with default zero/empty values
                    updateKPIs(null);
                    populateViolationsTable(null);
                    populateLiveAlerts(null);
                    populateMeetSection(null);
                    populateWatchlistModal(null); // New
                    renderViolationTrendsChart(null);
                    renderPlatformComparisonChart(null);
                }
            }
            
            // --- UI UPDATE FUNCTIONS ---

            function updateKPIs(kpiData) {
                document.getElementById('total-products').textContent = kpiData?.totalProducts?.toLocaleString() || '0';
                document.getElementById('active-violations').textContent = kpiData?.activeViolations?.toLocaleString() || '0';
                document.getElementById('watchlist-count').textContent = kpiData?.watchlistCount?.toLocaleString() || '0';
                document.getElementById('compliance-score').textContent = `${kpiData?.complianceScore || 0}%`;
            }

            function populateViolationsTable(violations) {
                const tableBody = document.getElementById('violations-table-body');
                tableBody.innerHTML = ''; 

                if (!violations || violations.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">No violation data available.</td></tr>`;
                    return;
                }

                violations.forEach(v => {
                    const row = document.createElement('tr');
                    row.className = 'bg-white border-b';
                    
                    const difference = v.actual_mrp - v.mrp_shown;
                    const diffPercent = v.mrp_shown !== 0 ? ((difference / v.mrp_shown) * 100).toFixed(0) : 0;
                    
                    let statusClass, diffClass;
                    if (v.status === 'Fraud') statusClass = 'bg-red-100 text-red-800';
                    else if (v.status === 'Check') statusClass = 'bg-yellow-100 text-yellow-800';
                    else statusClass = 'bg-green-100 text-green-800';

                    if (diffPercent < 0) diffClass = 'text-red-600';
                    else if (diffPercent > 0) diffClass = 'text-green-600';
                    else diffClass = 'text-gray-600';
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">${v.product}</td>
                        <td class="px-6 py-4">${v.platform}</td>
                        <td class="px-6 py-4">₹${v.mrp_shown.toLocaleString('en-IN')}</td>
                        <td class="px-6 py-4">₹${v.actual_mrp.toLocaleString('en-IN')}</td>
                        <td class="px-6 py-4 font-medium ${diffClass}">${diffPercent > 0 ? '+' : ''}${diffPercent}%</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusClass}">
                               <svg class="-ml-0.5 mr-1.5 h-2 w-2" fill="currentColor" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3" /></svg>
                                ${v.status}
                            </span>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            function populateLiveAlerts(alerts) {
                const container = document.getElementById('live-alerts');
                container.innerHTML = '';
                if (!alerts || alerts.length === 0) {
                    container.innerHTML = `<p class="text-center text-gray-500">No live alerts.</p>`;
                    return;
                }
                alerts.forEach(alert => {
                    const element = document.createElement('div');
                    element.className = 'text-sm';
                    element.innerHTML = `<p class="text-gray-500">${alert.time}</p><p class="text-gray-800">${alert.message}</p>`;
                    container.appendChild(element);
                });
            }

            function populateMeetSection(meetData) {
                const container = document.getElementById('meet-section');
                container.innerHTML = '';
                if (!meetData || meetData.length === 0) {
                    container.innerHTML = `<p class="text-center text-gray-500">No meetings scheduled.</p>`;
                    return;
                }
                meetData.forEach(meet => {
                    const element = document.createElement('div');
                    element.className = 'text-sm text-gray-600';
                    element.textContent = `• ${meet.time} ${meet.name}`;
                    container.appendChild(element);
                });
            }
            
            function populateWatchlistModal(items) {
                const container = document.getElementById('watchlist-modal-body');
                container.innerHTML = '';
                if (!items || items.length === 0) {
                    container.innerHTML = `<p class="text-center text-gray-500">No items on the watchlist.</p>`;
                    return;
                }
                items.forEach(item => {
                    const element = document.createElement('div');
                    element.className = 'p-3 bg-gray-50 rounded-lg border border-gray-200';
                    element.innerHTML = `
                        <p class="font-semibold text-gray-800">${item.product}</p>
                        <p class="text-sm text-red-600 font-medium">${item.reason}</p>
                        <p class="text-xs text-gray-500 mt-1">${item.platform} - ${item.id}</p>
                    `;
                    container.appendChild(element);
                });
            }

            // --- CHART RENDERING FUNCTIONS ---
            
            function renderChart(canvasId, chartInstance, chartConfig) {
                const ctx = document.getElementById(canvasId).getContext('2d');
                if (chartInstance) chartInstance.destroy();
                if (!chartConfig || !chartConfig.data.labels || chartConfig.data.labels.length === 0) {
                    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                    ctx.save();
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#9ca3af'; ctx.font = "16px 'Inter'";
                    ctx.fillText('No data available', ctx.canvas.width / 2, ctx.canvas.height / 2);
                    ctx.restore();
                    return null;
                }
                return new Chart(ctx, chartConfig);
            }
            
            function renderViolationTrendsChart(chartData) {
                const config = { type: 'line', data: { labels: chartData?.labels || [], datasets: [{ label: 'Violations', data: chartData?.data || [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 2, tension: 0.4, fill: true }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { drawBorder: false } }, x: { grid: { display: false } } } } };
                violationTrendsChart = renderChart('violationTrendsChart', violationTrendsChart, config);
            }
            
            function renderPlatformComparisonChart(chartData) {
                const config = { type: 'bar', data: { labels: chartData?.labels || [], datasets: [{ label: 'Violations', data: chartData?.data || [], backgroundColor: ['#3b82f6', '#60a5fa', '#93c5fd'], borderRadius: 5, borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { display: false, drawBorder: false } }, x: { grid: { display: false } } } } };
                platformComparisonChart = renderChart('platformComparisonChart', platformComparisonChart, config);
            }
            
            // --- MOCK DATA FUNCTION ---
            async function getMockData() {
                await new Promise(res => setTimeout(res, 500));
                return {
                    kpis: { totalProducts: 5420, activeViolations: 237, watchlistCount: 3, complianceScore: 88 },
                    watchlist: {
                        count: 3,
                        items: [
                            { id: 'SKU-987-XYZ', product: '"Miracle Cure" Health Supplement', reason: 'Unverified health claims detected.', platform: 'Amazon' },
                            { id: 'SKU-123-ABC', product: 'Luxury Watch "Rollex"', reason: 'Potential trademark infringement.', platform: 'Flipkart' },
                            { id: 'SKU-456-DEF', product: 'Gaming Laptop (Price: ₹15,000)', reason: 'Price too low, suspected scam listing.', platform: 'Amazon' }
                        ]
                    },
                    violations: [ { product: 'Nike Shoes XYZ', platform: 'Amazon', mrp_shown: 15000, actual_mrp: 25000, status: 'Fraud' }, { product: 'Apple iPhone 14', platform: 'Flipkart', mrp_shown: 80000, actual_mrp: 75000, status: 'Check' }, { product: 'Samsung 55" TV', platform: 'Amazon', mrp_shown: 65000, actual_mrp: 65000, status: 'OK' }, { product: 'Sony Headphones', platform: 'Myntra', mrp_shown: 19999, actual_mrp: 22000, status: 'Fraud' }, ],
                    liveAlerts: [ { time: '12:05 PM', message: 'Alert: MRP mismatch detected for Nike Shoes XYZ on Flipkart' }, { time: '11:47 AM', message: 'Alert: Seller ElectroWorld flagged for repeated violations' }, { time: '11:10 AM', message: 'Alert: Discount fraud detected on Samsung TV Amazon' }, ],
                    meet: [ { time: '12:05 PM', name: 'Allarketed' }, { time: '11:47 AM', name: 'Entry' }, { time: '11:10 AM', name: 'Allains' }, ],
                    violationTrends: { labels: ['Apr 1', 'Apr 2', 'Apr 3', 'Apr 4', 'Apr 5', 'Apr 6', 'Apr 7'], data: [1800, 2200, 2100, 3200, 2800, 3500, 3800] },
                    platformComparison: { labels: ['Amazon', 'Flipkart', 'Myntra'], data: [110, 95, 75] }
                };
            }

            // --- MODAL EVENT LISTENERS ---
            const watchlistCard = document.getElementById('watchlist-card');
            const watchlistModal = document.getElementById('watchlist-modal');
            const watchlistModalContent = document.getElementById('watchlist-modal-content');
            const closeWatchlistModal = document.getElementById('close-watchlist-modal');

            const openModal = () => {
                watchlistModal.classList.remove('hidden');
                watchlistModal.classList.add('flex');
                setTimeout(() => { // Allow display change to register before starting transition
                    watchlistModalContent.classList.remove('scale-95', 'opacity-0');
                    watchlistModalContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            };

            const closeModal = () => {
                watchlistModalContent.classList.remove('scale-100', 'opacity-100');
                watchlistModalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    watchlistModal.classList.add('hidden');
                    watchlistModal.classList.remove('flex');
                }, 300); // Match transition duration
            };

            watchlistCard.addEventListener('click', openModal);
            closeWatchlistModal.addEventListener('click', closeModal);
            watchlistModal.addEventListener('click', (event) => {
                if (event.target === watchlistModal) {
                    closeModal();
                }
            });

            // --- START THE APPLICATION ---
            initializeDashboard();
        });
    </script>
</body>
</html>
